# Render Blueprint — static site, no build step.
# Connect this repo in Render → "New" → "Blueprint"; Render reads this file.
# The repository root is the publish directory (index.html lives here).
services:
  - type: web
    name: codeckit
    runtime: static
    # The app has no build step. `true` is a harmless no-op so Render does not
    # try to guess a package manager from the lockfile-free repo.
    buildCommand: "true"
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.pwnedpasswords.com https://services.nvd.nist.gov; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
      # A service worker must never be pinned by a long cache: it is how the
      # next deploy reaches existing visitors.
      - path: /sw.js
        name: Cache-Control
        value: "no-cache, must-revalidate"
      - path: /manifest.json
        name: Cache-Control
        value: "public, max-age=3600"
